# ── Redirección 301: cualquier dominio que NO sea nuingroup.com va al principal ──
# Cubre www.nuingroup.com, nuin.es, www.nuin.es, nuin.alvarogalan.cloud, IP directa…
server {
    listen 80 default_server;
    server_name _;
    return 301 https://nuingroup.com$request_uri;
}

# ── Dominio principal ──
server {
    listen 80;
    server_name nuingroup.com;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión (el HTML lleva todo el CSS/JS inline → gran ahorro)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Estáticos: cache larga e inmutable
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # sitemap.xml y robots.txt siempre frescos
    location = /sitemap.xml { add_header Cache-Control "no-cache"; }
    location = /robots.txt  { add_header Cache-Control "no-cache"; }

    # HTML sin cache agresiva para que los cambios se vean al desplegar
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
